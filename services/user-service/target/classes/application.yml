server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_user}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-please-use-a-long-random-value}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
